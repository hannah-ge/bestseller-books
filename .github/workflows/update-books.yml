name: Update Bestseller Books

on:
  schedule:
    # Runs every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      fetch_history:
        description: 'Fetch historical NYT data (2016–present). Only needed once.'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  update-books:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest bestsellers
        env:
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
          GOOGLE_TRANSLATE_KEY: ${{ secrets.GOOGLE_TRANSLATE_KEY }}
          FETCH_HISTORY: ${{ github.event.inputs.fetch_history || 'false' }}
        run: node scripts/fetch-books.js

      # Gate: compares the freshly fetched data against the committed version.
      # Structural problems always fail; quality metrics fail only on regression,
      # so existing debt does not block but any improvement is locked in.
      - name: Validate data before publishing
        run: node scripts/validate-books.js

      # Structural validity does not prove the page renders. This loads the real
      # index.html headlessly and asserts on the post-load DOM, which is the only
      # check that catches a silent async-load failure.
      - name: Smoke test the page
        run: |
          npm install --no-save jsdom
          python3 -m http.server 8000 &
          for i in $(seq 1 15); do
            curl -sf http://localhost:8000/index.html >/dev/null && break
            sleep 1
          done
          node scripts/smoke-test.js

      - name: Upload rejected data for inspection
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rejected-books-json
          path: data/books.json
          retention-days: 7

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/books.json
          git diff --quiet --cached || (git commit -m "Update bestseller data [automated]" && git pull --rebase && git push)
